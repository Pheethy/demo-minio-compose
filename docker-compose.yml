services:
  minio:
    image: chainguard/minio:latest
    container_name: minio
    ports:
      - "9000:9000" # api
      - "9001:9001" # console
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: miniopassword
    volumes:
      - ./volume:/data
    command: server --address ":9000" --console-address ":9001" /data
    restart: always

networks:
  default:
    driver: bridge
